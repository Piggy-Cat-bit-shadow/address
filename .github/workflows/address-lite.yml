name: Address Lite

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the finished static site to the configured remote host
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '17 3 * * 0'

concurrency:
  group: address-lite-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.12'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate Lite manifest
        run: node scripts/lite/check-config.mjs
      - id: matrix
        shell: bash
        run: echo "matrix=$(node scripts/lite/matrix.mjs)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: server/sync/requirements.txt
      - name: Install runtime dependencies
        run: |
          npm ci --omit=dev
          python -m pip install --disable-pip-version-check -r server/sync/requirements.txt
      - name: Build verified residential target group
        env:
          ADDRESS_SYNC_LITE: 'true'
          ADDRESS_SYNC_OVERTURE_BUILDINGS: 'true'
          ADDRESS_SYNC_REQUIRE_RESIDENTIAL: 'true'
          ADDRESS_SYNC_TRANSLATION_ENABLED: 'false'
          ADDRESS_SYNC_TRANSLATION_COUNTRIES: ''
          TRANSLATION_BACKFILL_ENABLED: 'false'
          GOOGLE_TRANSLATION_ENABLED: 'false'
          ADDRESS_SYNC_RETAIN_RAW: 'false'
          ADDRESS_SYNC_PREPARE_CONCURRENCY: '1'
          ADDRESS_SYNC_CPU_CONCURRENCY: '1'
          ADDRESS_SYNC_LITE_CANDIDATE_MULTIPLIER: '2'
          ADDRESS_SYNC_LITE_MIN_CANDIDATES: '32'
          ADDRESS_SYNC_LITE_MAX_CANDIDATES: '15000'
        run: |
          mkdir -p "$RUNNER_TEMP/lite-out"
          /usr/bin/time -v node scripts/lite/build-unit.mjs \
            --group '${{ matrix.group }}' \
            --out "$RUNNER_TEMP/lite-out" \
            --work "$RUNNER_TEMP/lite-work" \
            2> >(tee "$RUNNER_TEMP/time-${{ matrix.group }}.log" >&2)
          cp "$RUNNER_TEMP/time-${{ matrix.group }}.log" "$RUNNER_TEMP/lite-out/metrics/time-${{ matrix.group }}.log"
      - uses: actions/upload-artifact@v7
        with:
          name: lite-${{ matrix.group }}
          path: ${{ runner.temp }}/lite-out
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  assemble:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: lite-*
          path: ${{ runner.temp }}/lite-artifacts
          merge-multiple: true
      - name: Assemble static shards
        run: |
          rm -rf public/data
          node scripts/lite/aggregate.mjs --input "$RUNNER_TEMP/lite-artifacts" --output public/data
          node scripts/lite/verify-static.mjs --data public/data
          node scripts/lite/summarize-metrics.mjs --metrics "$RUNNER_TEMP/lite-artifacts/metrics"
      - name: Build static website
        env:
          PUBLIC_API_BASE_URL: ''
        run: npm run build
      - name: Package release
        shell: bash
        run: |
          release="address-lite-${GITHUB_SHA::12}.tar.gz"
          tar -C dist -czf "$RUNNER_TEMP/$release" .
          (cd "$RUNNER_TEMP" && sha256sum "$release" > "$release.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: address-lite-site
          path: |
            ${{ runner.temp }}/address-lite-*.tar.gz
            ${{ runner.temp }}/address-lite-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: address-lite-metrics
          path: ${{ runner.temp }}/lite-artifacts/metrics
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

  deploy:
    needs: assemble
    if: ${{ github.event_name == 'schedule' || inputs.deploy == true }}
    runs-on: ubuntu-latest
    environment: address-lite-production
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: address-lite-site
          path: ${{ runner.temp }}/release
      - id: config
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [[ -n "$DEPLOY_HOST" && -n "$DEPLOY_USER" && -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_ROOT" && -n "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Deployment secrets are not fully configured; deployment is skipped.'
          fi
      - name: Deploy atomically to remote host
        if: steps.config.outputs.ready == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          root="$DEPLOY_ROOT"
          release_id="${GITHUB_SHA::12}"
          archive="$(find "$RUNNER_TEMP/release" -name 'address-lite-*.tar.gz' -type f | head -n1)"
          checksum="$archive.sha256"
          credential_dir="$RUNNER_TEMP/address-lite-deploy-credentials"
          private_key="$credential_dir/private-key"
          known_hosts="$credential_dir/known_hosts"
          cleanup_local_credentials() {
            rm -rf -- "$credential_dir"
          }
          trap cleanup_local_credentials EXIT
          (cd "$(dirname "$archive")" && sha256sum -c "$(basename "$checksum")")
          install -m 700 -d "$credential_dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$private_key"
          chmod 600 "$private_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$known_hosts"
          ssh_options=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts")
          scp -P "$port" -i "$private_key" "${ssh_options[@]}" "$archive" "$checksum" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"
          ssh -p "$port" -i "$private_key" "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "ROOT='$root' RELEASE='$release_id' bash -s" <<'REMOTE'
          set -euo pipefail
          umask 022
          archive="/tmp/address-lite-$RELEASE.tar.gz"
          checksum="$archive.sha256"
          incoming="$ROOT/releases/$RELEASE.incoming"
          final="$ROOT/releases/$RELEASE"
          cleanup_remote_files() {
            rm -f -- "$archive" "$checksum"
            if [[ -n "${incoming:-}" && -d "$incoming" ]]; then
              rm -rf -- "$incoming"
            fi
          }
          trap cleanup_remote_files EXIT
          cd /tmp
          sha256sum -c "$(basename "$checksum")"
          mkdir -p "$ROOT/releases"
          rm -rf "$incoming"
          mkdir -p "$incoming"
          tar --no-same-owner -xzf "$archive" -C "$incoming"
          test -s "$incoming/index.html"
          test -s "$incoming/data/countries.json"
          if [[ -e "$final" ]]; then
            test -s "$final/index.html"
            test -s "$final/data/countries.json"
            rm -rf "$incoming"
          else
            mv "$incoming" "$final"
          fi
          incoming=''
          ln -sfn "releases/$RELEASE" "$ROOT/current.next"
          mv -Tf "$ROOT/current.next" "$ROOT/current"
          active_release="$(basename "$(readlink "$ROOT/current")")"
          mapfile -t release_dirs < <(find "$ROOT/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %f\n' | sort -rn | cut -d' ' -f2-)
          formal_releases=()
          for release_dir in "${release_dirs[@]}"; do
            if [[ "$release_dir" =~ ^[0-9a-f]{12}$ ]]; then
              formal_releases+=("$release_dir")
            fi
          done
          declare -A keep_releases=(["$active_release"]=1)
          for release_dir in "${formal_releases[@]:0:3}"; do
            keep_releases["$release_dir"]=1
          done
          for release_dir in "${formal_releases[@]}"; do
            if [[ -z "${keep_releases[$release_dir]:-}" ]]; then
              rm -rf -- "$ROOT/releases/$release_dir"
            fi
          done
          REMOTE
