name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v2.0.1
        required: true
        default: v2.0.1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run check:public
      - run: bash -n ops/*.sh
      - run: python3 -m py_compile server/sync/*.py

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version='${{ inputs.version }}'
          else
            version="${GITHUB_REF_NAME}"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Reject duplicate release
        shell: bash
        run: |
          if gh release view '${{ steps.version.outputs.value }}' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists' >&2
            exit 1
          fi
      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo 'Tag already exists' >&2
            exit 1
          fi
          gh api --method POST "/repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$version" -f "sha=$GITHUB_SHA" >/dev/null
      - name: Build public VPS packages
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.value }}'
          name="address-$version"
          mkdir -p "release/$name"
          for path in .dockerignore .env.example Dockerfile docker-compose.yml LICENSE README.md README.zh-CN.md README.zh-TW.md astro.config.mjs package.json package-lock.json tsconfig.json config docs image ops public scripts server src; do
            cp -a "$path" "release/$name/"
          done
          cp -a dist "release/$name/dist"
          find "release/$name" -type d -name __pycache__ -prune -exec rm -rf {} +
          tar -C release -czf "release/$name.tar.gz" "$name"
          (cd release && zip -qr "$name.zip" "$name")
          (cd release && sha256sum "$name.tar.gz" "$name.zip" > SHA256SUMS.txt)
      - name: Audit package contents
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.value }}'
          name="address-$version"
          test -s "release/$name.tar.gz"
          test -s "release/$name.zip"
          test -s release/SHA256SUMS.txt
          if find "release/$name" -type f \( -name '.env' -o -name '*.sqlite' -o -name '*.db' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo 'Private file shape found in release package' >&2
            exit 1
          fi
          (cd release && sha256sum -c SHA256SUMS.txt)
      - name: Write release notes
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          cat > release/RELEASE_NOTES.md <<NOTES
          ## Address $version

          > 自托管真实住宅地址生成器，支持 27 个国家和地区。

          本版本新增地址收藏和完整 API 文档，统一 Docker Compose 部署，并进一步完善地址同步、凭据轮换与异常恢复。

          ### 新增功能
          - 地址收藏保存在浏览器中，支持按大洲或国家分组与筛选、拖动排序、序号排序、复制、删除和地图跳转。
          - 扩展 JSON API，新增地区搜索、行政层级、批量生成、地址详情、翻译和数据健康状态等接口。
          - API 文档新增 Python、cURL 和 JavaScript 示例，并按认证范围展示参数与响应。
          - 新增 Docker Compose 部署和 Docker Hub AMD64/ARM64 镜像。

          ### 优化改进
          - 管理员后台集中管理前端密码、管理员密码、API Token、平台密钥、额度、快捷区域、地址规则和同步队列。
          - 同步状态同时判断地址总量、行政区覆盖率和节点最低数量，任一规则未达标都不会标记完成。
          - 多个平台密钥独立轮换；当前密钥不可用时切换其他密钥，全部冷却时等待最早恢复时间。
          - 已耗尽来源不再重复下载；仍有新增能力的其他来源可以继续执行。

          ### Bug 修复
          - 修复同步任务异常终止后残留锁可能阻止后续任务的问题。
          - 修复无增长或重复失败的来源可能被反复加入队列的问题。
          - 增加任务硬超时、有限重试、指数退避和失败签名暂停机制。
          - 增加同步暂存文件、超时产物和失败备份的自动清理与恢复。

          ### 升级方式

              docker compose pull
              docker compose up -d

          完整安装、升级和备份说明见 [部署文档](https://github.com/daimon3332/address/blob/main/docs/DEPLOYMENT.zh-CN.md)。
          NOTES
      - name: Publish stable GitHub release
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          gh release create "$version" \
            "release/address-$version.tar.gz" \
            "release/address-$version.zip" \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Address $version" \
            --notes-file release/RELEASE_NOTES.md \
            --verify-tag
