name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v2.0.1
        required: true
        default: v2.0.1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run check:public
      - run: bash -n ops/*.sh
      - run: python3 -m py_compile server/sync/*.py

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version='${{ inputs.version }}'
          else
            version="${GITHUB_REF_NAME}"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Reject duplicate release
        shell: bash
        run: |
          if gh release view '${{ steps.version.outputs.value }}' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists' >&2
            exit 1
          fi
      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo 'Tag already exists' >&2
            exit 1
          fi
          gh api --method POST "/repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$version" -f "sha=$GITHUB_SHA" >/dev/null
      - name: Build public VPS packages
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.value }}'
          name="address-$version"
          mkdir -p "release/$name"
          for path in .dockerignore .env.example Dockerfile docker-compose.yml LICENSE README.md README.zh-CN.md README.zh-TW.md astro.config.mjs package.json package-lock.json tsconfig.json config docs image ops public scripts server src; do
            cp -a "$path" "release/$name/"
          done
          cp -a dist "release/$name/dist"
          find "release/$name" -type d -name __pycache__ -prune -exec rm -rf {} +
          tar -C release -czf "release/$name.tar.gz" "$name"
          (cd release && zip -qr "$name.zip" "$name")
          (cd release && sha256sum "$name.tar.gz" "$name.zip" > SHA256SUMS.txt)
      - name: Audit package contents
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.value }}'
          name="address-$version"
          test -s "release/$name.tar.gz"
          test -s "release/$name.zip"
          test -s release/SHA256SUMS.txt
          if find "release/$name" -type f \( -name '.env' -o -name '*.sqlite' -o -name '*.db' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo 'Private file shape found in release package' >&2
            exit 1
          fi
          (cd release && sha256sum -c SHA256SUMS.txt)
      - name: Write bilingual release notes
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          cat > release/RELEASE_NOTES.md <<NOTES
          ## Address $version

          ### Docker Compose deployment
          Docker Compose is the recommended installation path. It pulls \`daimon23/address\`, starts PostgreSQL, runs migrations, and starts the API and automatic synchronization services.

              git clone https://github.com/daimon3332/address.git
              cd address
              sh ops/init-compose.sh
              docker compose up -d

          ### Highlights
          - Real residential address and test-profile generation for 27 configured countries and regions.
          - Browser-persistent address favorites with continent/country grouping, filters, drag-and-drop ordering, numeric ordering, copy, delete, and map links.
          - Full-pool random selection, strict location filters, multilingual presentation, and persistent language preferences.
          - Expanded JSON API with Python, cURL, and JavaScript examples.
          - Administrator controls for frontend and administrator passwords, API tokens, provider keys, quotas, quick locations, address rules, and the synchronization queue.
          - PostgreSQL storage and automated synchronization with multi-rule completion, bounded retries, cooldowns, source-exhaustion handling, and temporary-file cleanup.

          ### Docker Compose 部署
          推荐使用 Docker Compose。它会拉取 \`daimon23/address\`，启动 PostgreSQL、数据库迁移、API 和自动同步服务。

              git clone https://github.com/daimon3332/address.git
              cd address
              sh ops/init-compose.sh
              docker compose up -d

          ### 主要功能
          - 为 27 个已配置国家和地区生成真实住宅地址与测试资料。
          - 地址收藏保存在浏览器中，支持按大洲或国家分组与筛选、拖动排序、序号排序、复制、删除和地图跳转。
          - 支持完整地址池随机选择、严格地区筛选、多语言展示和语言偏好记忆。
          - 提供扩展 JSON API，以及 Python、cURL 和 JavaScript 调用示例。
          - 管理员后台可设置前端密码、管理员密码、API Token、平台 Key、额度、快捷区域、地址规则和同步队列。
          - 使用 PostgreSQL，并通过多重完成规则、有限重试、冷却、来源耗尽判定和临时文件清理实现自动同步。

          ### License / 许可证
          Project source code is MIT-licensed. Upstream datasets retain their own licenses and attribution requirements.
          NOTES
      - name: Publish stable GitHub release
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          gh release create "$version" \
            "release/address-$version.tar.gz" \
            "release/address-$version.zip" \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Address $version" \
            --notes-file release/RELEASE_NOTES.md \
            --verify-tag
